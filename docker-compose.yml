name: openjidoka

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-openjidoka}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-openjidoka}
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
  TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-openjidoka}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openjidoka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-openjidoka}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # Temporal persists workflow history in the same Postgres server (databases temporal + temporal_visibility).
  temporal:
    image: temporalio/auto-setup:1.29
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-openjidoka}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:7233:7233"

  temporal-ui:
    image: temporalio/ui:2.42.1
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8080"

  api:
    build: { context: ., target: api }
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN in .env}
      API_PORT: 3000
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  worker:
    build: { context: ., target: worker }
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      OPENJEV_MODE: ${OPENJEV_MODE:-mock}
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  admin:
    build: { context: ., target: admin }
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    restart: unless-stopped

  # One-shot, idempotent: example workflow + placeholder connections. Run with `docker compose run --rm seed`.
  seed:
    build: { context: ., target: api }
    profiles: [seed]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    command: ["node_modules/.bin/tsx", "src/seed.ts"]

volumes:
  pgdata:
